<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Memory Garden - Shakshi</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(#1d3b22,#5d9b62);
    overflow-x:hidden;
    overflow-y:auto;
    color:#fff;
}
.f{position:fixed;inset:0}.i{position:absolute;font-size:24px;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-10vh)}to{transform:translateY(110vh) rotate(360deg)}}
.box{max-width:760px;margin:8vh auto;background:rgba(255,255,255,.12);padding:28px;border-radius:18px;text-align:center;backdrop-filter:blur(8px)}
h1{font-size:48px;color:#ffd0ea}#msg{font-size:26px;line-height:1.8;min-height:220px;white-space:pre-wrap}
button{padding:14px 28px;border:none;border-radius:30px;background:#ff5ca8;color:#fff;font-size:20px}
</style></head><body>
<div class=f id=f></div>
<div class=box><h1>🌸 Memory Garden 🌸</h1><div id=msg></div><button>Next Surprise ➜</button></div>
<script>
const t=`Dear Shakshi,

We first met online, but life gave me something much more precious—a sister. ❤️

Some people are connected by blood, but we are connected by trust, care, kindness, and beautiful memories.

No matter how far we are, you'll always have a special place in my heart as my sister.

Happy Birthday, Shakshi! 🌸`;
let e=msg,n=0;(function w(){if(n<t.length){e.textContent+=t[n++];window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
});setTimeout(w,35)}})();
for(let i=0;i<70;i++){let d=document.createElement('div');d.className='i';d.textContent=['🌸','🌺','🌼','🍀','🦋'][Math.floor(Math.random()*5)];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(6+Math.random()*8)+'s';d.style.animationDelay=(-Math.random()*10)+'s';f.appendChild(d);}
</script></body></html>
